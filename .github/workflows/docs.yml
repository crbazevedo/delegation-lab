name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "web/**"
      - "talks/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" mkdocs-material "mkdocstrings[python]"

      - name: Stage the interactive widgets into the docs site (served at /app/)
        run: |
          cp -r web docs/app
          rm -f docs/app/README.md

      - name: Stage talks into the docs site (served at /talks/)
        run: |
          mkdir -p docs/talks
          cp -r talks/* docs/talks/
          find docs/talks -name README.md -delete

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
