# Source: Vectara HHEM (https://github.com/vectara/hallucination-leaderboard) +
#         FaithBench/RAGTruth (https://arxiv.org/abs/2505.04847)

  - model: claude-opus-4
    task_type: drafting
    sigma_raw: { low: 0.83, mid: 0.89, high: 0.95 }
    primary_benchmark: Vectara-HHEM + FaithBench/RAGTruth (faithfulness subdim)
