# ---- DRAFTING / OPEN GENERATION / SUMMARIZATION --------------------------------
# NO clean absolute per-step success benchmark for open generation.
# Faithfulness sub-dimension: seeded from Vectara HHEM (absolute faithfulness rate
# for grounded summarization). Style/instruction-following quality is RELATIVE-ONLY
