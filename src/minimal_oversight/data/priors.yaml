# ---- REVIEW / CRITIQUE / VERIFICATION (catch_rate) ----------------------------
# SOFTEST COLUMN. Widest bands. Best public evidence: FaithJudge zero-shot on
# FaithBench (arXiv 2505.04847) + MT-Bench human agreement (arXiv 2306.05685) +
# RewardBench-2 (arXiv 2506.01937) + CriticBench (arXiv 2402.14809).
#
# Key constraints:
#   - 84% FaithJudge headline is FEW-SHOT (9 peer examples in-context) — an
#     optimistic ceiling a real pipeline won't have.
#   - Zero-shot best: o3-mini-high 68.8% balanced accuracy on FaithBench.
#   - RewardBench-2 shows ~20pp drop vs v1 on harder/realistic distributions.
#   - Same-family self-critique is PARTIALLY RELATIVE (self-enhancement bias) —
#     subtract ~0.05-0.10 from mid and widen.
#   - CriticBench: stronger critic vs weaker target = better catch; weaker critic
