# ---- EXTRACTION / STRUCTURED OUTPUT -------------------------------------------
# Anchor: JSONSchemaBench (EPFL-DLab, Feb 2025, arXiv 2501.10868).
# CRITICAL: dominated by schema-difficulty x constrained-decoding, NOT model
# family. Rows below assume MODERATE schema (most common real-world case) with
# PLAIN prompting (no constrained decoding). For constrained-decoding APIs,
# raise mid by +0.10 to +0.20. For hard/deeply-nested schemas, lower low by -0.30.
# Source: https://arxiv.org/abs/2501.10868 (Table 4, Feb 2025)

  - model: claude-opus-4
    task_type: extraction
    sigma_raw: { low: 0.82, mid: 0.91, high: 0.98 }
    primary_benchmark: JSONSchemaBench
    metric: schema-compliance rate (plain prompting, moderate schema)
    metric_kind: absolute
    reported_value: "frontier tier: GlaiveAI ~0.97-1.00 (constrained); plain moderate ~0.85-0.95"
    sample_size: "1707-1943 schemas per dataset"
    observed_date: "2025-02"
    source_url: https://arxiv.org/abs/2501.10868
