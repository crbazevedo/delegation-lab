# priors.yaml — cold-start task-competence priors for MSO.
#
# Each entry estimates a (model x task_type) cell. For generator task-types the
# payload is `sigma_raw` (raw success probability BEFORE any review); for the
# `review` task-type the payload is `catch_rate` (how well the model catches an
# upstream node's errors). Both are LOW/MID/HIGH bands with provenance, never
# point estimates.
#
# THESE ARE PRIORS: starting hypotheses to seed a cockpit/notebook node when the
# user has no traces yet. They are meant to be refined by the user's own logged
# outcomes (see minimal_oversight.estimation). A wide band == weak evidence.
#
# Normalization rules baked into the curated values:
#   - ABSOLUTE metrics (pass@1, accuracy, F1) ~ success probability -> sigma_raw
#     directly, with a modest domain-shift discount (recorded in the note).
#   - RELATIVE metrics (Arena Elo, win-rates) are RANKINGS, never inverted into
#     sigma. They only rank/interpolate models whose scale is pinned by an
#     absolute benchmark. metric_kind=relative cells always carry a wider band.
#   - review/catch_rate is the SOFTEST column (little public evidence) -> widest
#     bands; treat as a placeholder until the user logs corrected outcomes.
#
# Sources:
#   LiveBench Coding: https://livebench.ai/livebench.pdf (June-2024, arXiv 2406.19314)
#   JSONSchemaBench: https://arxiv.org/abs/2501.10868 (EPFL-DLab, Feb 2025)
#   Vectara HHEM: https://github.com/vectara/hallucination-leaderboard
#   FaithBench/RAGTruth: https://arxiv.org/abs/2505.04847 (EMNLP 2025)
#   AlpacaEval LC: https://arxiv.org/abs/2404.04475
#   MT-Bench: https://arxiv.org/abs/2306.05685
#   RewardBench-2: https://arxiv.org/abs/2506.01937
#   CriticBench: https://arxiv.org/pdf/2402.14809
#   FaithJudge: https://arxiv.org/abs/2505.04847

meta:
  schema_version: 1
  gamma: 0.8333333333333334   # return-operator fixed-point gain eta/(eta+delta)=10/12
  status: curated              # placeholder -> curated after research pass (2026-06-17)
  observed_date: "2026-06-17"  # date this table was compiled; check for staleness
  generator_default_catch_rate: 0.0   # a generator does not correct its parent

task_types:
  - code_generation
  - classification
  - extraction
  - drafting
  - retrieval
  - review        # catch-rate proxy

# ---- CODE GENERATION ----------------------------------------------------------
# Anchor: LiveBench Coding (contamination-limited, ground-truth scored, no LLM
# judge, LCB-anchored pass-style). Scores in [0,100]; mapped to sigma_raw with
# ~10% domain-shift discount and widened bands. Frontier 2026 models (Opus/
# Sonnet 4.x, o-series, Gemini 2.x) lack clean 2026 absolute numbers and are
# interpolated up from June-2024 snapshots via relative leaderboards — flagged.
# HumanEval cross-check: confirms small-model HumanEval inflates (~87% → SWE-
# bench-Verified ~23%), so bands are wide to capture both saturation cases.
# Source: https://livebench.ai/livebench.pdf (Table 1, June 2024)
