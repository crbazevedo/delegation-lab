# ---- CORRECTION · corrector fix-success (fix_rate) ----------------------------
# Corrector REPAIR-success given a flagged error: P(repair succeeds | flagged).
# KEY FINDING (multiple papers): intrinsic self-correction WITHOUT external
# feedback is unreliable (at/below baseline); WITH reviewer feedback it improves.
# arXiv:2310.01798 (LLMs Cannot Self-Correct Reasoning Yet) · TACL 2024.

  - model: corrector-no-feedback
    task_type: correction
    fix_rate: { low: 0.10, mid: 0.30, high: 0.55 }
    primary_benchmark: "LLMs Cannot Self-Correct Reasoning Yet"
    metric: P(repair succeeds | flagged), no external signal
    metric_kind: absolute
    reported_value: "intrinsic self-correction at/below baseline; can degrade"
    sample_size: null
    observed_date: "2023-10"
    source_url: https://arxiv.org/abs/2310.01798
    normalization_note: corrector with NO reviewer feedback; unreliable → low/wide band; this is why detection (reviewer) and repair (corrector) must be modeled separately
  - model: corrector-with-feedback
    task_type: correction
    fix_rate: { low: 0.55, mid: 0.70, high: 0.85 }
    primary_benchmark: "When Can LLMs Actually Correct Their Own Mistakes (TACL 2024)"
    metric: P(repair succeeds | flagged), with reviewer feedback
    metric_kind: absolute
    reported_value: "correction with reliable external feedback materially beats baseline"
    sample_size: null
    observed_date: "2024"
    source_url: https://direct.mit.edu/tacl/article/doi/10.1162/tacl_a_00713/125177
    normalization_note: corrector that CONSUMES reviewer feedback and re-does/patches; fix_rate is high only when the feedback signal is reliable; SOURCED
  - model: corrector-with-oracle
    task_type: correction
    fix_rate: { low: 0.65, mid: 0.78, high: 0.90 }
    primary_benchmark: Reflexion / agentic re-do with test or oracle signal
    metric: P(repair succeeds | flagged), with verifiable signal
    metric_kind: absolute
    reported_value: "agentic re-do with unit-test/oracle signal repairs reliably"
    sample_size: null
    observed_date: "2023"
    source_url: https://arxiv.org/abs/2303.11366
    normalization_note: corrector with a verifiable signal (tests, exec results); highest fix_rate; degrades if the signal is noisy; SOURCED
