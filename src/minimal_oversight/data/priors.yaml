    metric_kind: absolute
    reported_value: "63.2 (claude-3.5-sonnet anchor) + upward interpolation"
    sample_size: "~500 problems (LiveCodeBench)"
    observed_date: "2024-06"
    source_url: https://livebench.ai/livebench.pdf
    normalization_note: interpolated above claude-3.5-sonnet 63.2 via relative leaderboard; 10% domain-shift discount; wide band

